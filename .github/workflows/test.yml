name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.9 is the floor this project targets (the oldest python macOS still ships);
        # 3.14 is the newest, run to catch anything the floor version's stdlib papers over.
        python-version: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -t . -v

  packaging:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: agentbus --help
      # exit 4 here is doctor correctly reporting "not wired up" -- there is no ~/.claude on a
      # bare CI runner, that's expected, not a failure. Only the JSON shape is being smoke-tested,
      # so the doctor call's own exit code is deliberately not checked.
      - run: agentbus doctor --json > doctor.json || true
      - run: python3 -c "import json; json.load(open('doctor.json'))"

  typescript:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd adapters/ts && bun test
